# ====================================================================
# Spring Boot Configuration - Construction Management System
# ====================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=construction-management-system

# Microsoft SQL Server Database Configuration
# Supports standard SQLEXPRESS local instance
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ConstructionDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Multipart File Upload Configuration (House plans, receipts, docs)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Custom File Storage Directory
file.upload-dir=uploads/

# Static Resource Locations (Frontend served from classpath:/static/ and local uploads)
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
